<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <title>EchoSEO</title>

    <link rel="stylesheet" href="style.css" />

    <!-- Baloo 2 voor logo / headings -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&display=swap"
    />
  </head>
  <body>
    <main class="dashboard">
      <!-- HEADER -->
      <header class="topbar">
        <div class="logo-wrap">
          <small>Social account seo intelligence</small>
          <h1 class="logo">EchoSEO</h1>
        </div>

        <div class="header-score">
          <div class="header-score-label">SEO score</div>
          <strong id="scoreValue">--</strong>
        </div>
      </header>

      <!-- SEARCH -->
      <section class="search-panel">
        <form id="searchForm">
          <div class="search-bar">
            <input
              id="searchInput"
              type="text"
              placeholder="Search a username, email or handle"
              autocomplete="off"
            />
            <button type="submit">Analyse</button>
          </div>
        </form>
        <p class="search-help">
          Demo inputs: <strong>goede username</strong> of
          <strong>slechte username</strong>
        </p>
      </section>

      <!-- RESULT + ANALYSE KAARTEN -->
      <section class="layout">
        <!-- LINKS: RESULT OVERVIEW -->
        <article class="card hits-card">
          <div class="card-heading">
            <h2>gevonden accounts</h2>
          </div>

          <div id="hitsContent">
            <!-- wordt gevuld door app.js -->
          </div>
        </article>

        <!-- RECHTS: SEO ANALYSIS -->
        <article class="card summary-card">
          <div class="card-heading">
            <h2>samenvatting & suggesties</h2>
          </div>

          <div id="summaryContent">
            <!-- wordt gevuld door app.js -->
          </div>
        </article>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
